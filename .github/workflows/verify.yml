name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test MCP image transport and local fixture server
        run: node --test tests/browser-vision-mcp.test.mjs tests/editor-fixture.test.mjs
      - name: Test with Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Run-Tests.ps1
      - name: Test with PowerShell 7
        shell: pwsh
        run: ./tests/Run-Tests.ps1
