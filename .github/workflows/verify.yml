name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Test with ${{ matrix.shell }}
        shell: ${{ matrix.shell }}
        run: ./tests/Run-Tests.ps1
